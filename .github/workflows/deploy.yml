name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch: # "Run workflow" button: redeploy now (e.g. after editing the résumé doc)
  schedule:
    - cron: '0 12 * * *' # daily, 7–8am New York time: picks up Google Docs résumé edits

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Pull latest résumé from Google Docs
        run: bash scripts/fetch-resume.sh
        env:
          RESUME_DOC_ID: ${{ secrets.RESUME_DOC_ID }}
      - uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
